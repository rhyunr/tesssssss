<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebGIS Heritage Yogyakarta</title>

<!-- LEAFLET -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:#0D0D0D;
}

#map{
  width:100%;
  height:100vh;
}

/* HEADER */

#header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;

  z-index:9999;

  background:#2A1505;
  border-bottom:2px solid #D4A017;

  display:flex;
  align-items:center;

  padding:0 20px;

  color:#D4A017;

  font-size:20px;
  font-weight:bold;
}

/* SIDEBAR */

#sidebar{
  position:fixed;

  top:72px;
  left:0;
  bottom:0;

  width:320px;

  overflow-y:auto;

  background:rgba(18,8,2,.96);

  z-index:999;

  border-right:1px solid rgba(255,255,255,.08);
}

#building-list{
  padding:10px;
}

.building-item{
  padding:14px;
  margin-bottom:10px;

  background:#1E140A;

  border:1px solid rgba(255,255,255,.08);

  cursor:pointer;

  transition:.2s;
}

.building-item:hover{
  background:#3B1F0A;
}

.building-title{
  color:#D4A017;
  font-size:16px;
  font-weight:bold;
}

.building-category{
  color:#C9B99A;
  font-size:12px;
  margin-top:4px;
}

#info-panel{
  padding:10px;
}

.info-image{
  width:100%;
  height:220px;
  object-fit:cover;

  border:1px solid rgba(255,255,255,.1);
}

.info-title{
  color:#D4A017;
  margin-top:12px;
  font-size:20px;
  font-weight:bold;
}

.info-desc{
  color:#ddd;
  line-height:1.7;
  margin-top:10px;
  font-size:14px;
}

/* POPUP */

.leaflet-popup-content-wrapper{
  background:#1E140A;
  color:white;
}

.leaflet-popup-tip{
  background:#1E140A;
}

</style>
</head>

<body>

<div id="header">
🏯 WebGIS Heritage Yogyakarta
</div>

<div id="sidebar">

  <div id="building-list"></div>

  <div id="info-panel"></div>

</div>

<div id="map"></div>

<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================
   GEOJSON INLINE
========================================= */

const heritageData = {
  "type":"FeatureCollection",
  "features":[

    {
      "type":"Feature",
      "properties":{
        "id":1,
        "name":"Taman Sari",
        "kategori":"Keraton",
        "icon":"🏯",
        "deskripsi":"Taman Sari adalah situs taman kerajaan Kesultanan Yogyakarta yang dibangun pada abad ke-18.",
        "gambar":[
          "https://images.unsplash.com/photo-1583396618422-2a1f0f7f9d72?q=80&w=1200&auto=format&fit=crop",
          "https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?q=80&w=1200&auto=format&fit=crop"
        ]
      },
      "geometry":{
        "type":"Point",
        "coordinates":[110.359, -7.810]
      }
    },

    {
      "type":"Feature",
      "properties":{
        "id":2,
        "name":"Benteng Vredeburg",
        "kategori":"Kolonial",
        "icon":"🏛️",
        "deskripsi":"Benteng peninggalan kolonial Belanda yang berada di pusat Kota Yogyakarta.",
        "gambar":[
          "https://images.unsplash.com/photo-1524499982521-1ffd58dd89ea?q=80&w=1200&auto=format&fit=crop"
        ]
      },
      "geometry":{
        "type":"Point",
        "coordinates":[110.369, -7.800]
      }
    }

  ]
};

/* =========================================
   INIT MAP
========================================= */

const map = L.map('map',{
  center:[-7.800,110.366],
  zoom:14
});

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  attribution:'© OpenStreetMap contributors'
}).addTo(map);

/* =========================================
   MARKERS
========================================= */

const markersLayer = L.layerGroup().addTo(map);

heritageData.features.forEach(feature=>{

  const props = feature.properties;

  const [lng,lat] = feature.geometry.coordinates;

  const marker = L.marker([lat,lng]).addTo(markersLayer);

  marker.bindPopup(`
    <b>${props.icon} ${props.name}</b><br>
    ${props.kategori}
  `);

  marker.on('click',()=>{

    showInfo(props);

  });

});

/* =========================================
   SIDEBAR LIST
========================================= */

const buildingList = document.getElementById('building-list');

heritageData.features.forEach(feature=>{

  const props = feature.properties;

  const item = document.createElement('div');

  item.className = 'building-item';

  item.innerHTML = `
    <div class="building-title">
      ${props.icon} ${props.name}
    </div>

    <div class="building-category">
      ${props.kategori}
    </div>
  `;

  item.onclick = ()=>{

    const [lng,lat] = feature.geometry.coordinates;

    map.flyTo([lat,lng],17);

    showInfo(props);

  };

  buildingList.appendChild(item);

});

/* =========================================
   INFO PANEL
========================================= */

function showInfo(props){

  const panel = document.getElementById('info-panel');

  let imageHTML = '';

  if(Array.isArray(props.gambar)){

    imageHTML = `
      <img
      class="info-image"
      src="${props.gambar[0]}">
    `;

  }else{

    imageHTML = `
      <img
      class="info-image"
      src="${props.gambar}">
    `;
  }

  panel.innerHTML = `

    ${imageHTML}

    <div class="info-title">
      ${props.name}
    </div>

    <div class="info-desc">
      ${props.deskripsi}
    </div>

  `;
}

</script>

</body>
</html>
